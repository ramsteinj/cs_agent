services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cs_agent
      POSTGRES_USER: cs_agent
      POSTGRES_PASSWORD: cs_agent
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs_agent"]
      interval: 5s

volumes:
  pgdata:
